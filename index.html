<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CageTrack — Peterman Brothers</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ============ TOP BAR ============ -->
    <header class="topbar">
      <button class="brand" id="brandSlot" title="Click to reset filters & view"></button>

      <div class="topbar-center">
        <div class="clock">
          <span class="clock-time" id="clockTime">—</span>
          <span class="clock-date" id="clockDate">—</span>
        </div>
      </div>

      <div class="topbar-right">
        <span id="dataSourceTag" class="tag tag-mock">
          <span class="dot"></span><span id="dataSourceText">Mock data</span>
        </span>
        <span id="lastUpdated" class="updated">—</span>
        <button id="refreshBtn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" class="ic"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          Refresh
        </button>
      </div>
    </header>

    <!-- ============ KPI CARDS (clickable) ============ -->
    <section class="kpi-grid" aria-label="Key metrics">
      <button class="kpi-card" data-accent="blue" data-view="out">
        <div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
        <div class="kpi-body">
          <div class="kpi-label">Check-outs Today</div>
          <div class="kpi-value" id="kpiCheckouts">—</div>
        </div>
      </button>

      <button class="kpi-card" data-accent="green" data-view="returns">
        <div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
        <div class="kpi-body">
          <div class="kpi-label">Returns Today</div>
          <div class="kpi-value" id="kpiReturns">—</div>
        </div>
      </button>

      <button class="kpi-card" data-accent="navy" data-view="out">
        <div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></div>
        <div class="kpi-body">
          <div class="kpi-label">Currently Out</div>
          <div class="kpi-value" id="kpiOutstanding">—</div>
        </div>
      </button>

      <button class="kpi-card kpi-danger" data-accent="red" data-view="overdue">
        <div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.86l-8.5 14.7A2 2 0 0 0 3.5 21h17a2 2 0 0 0 1.7-2.44l-8.5-14.7a2 2 0 0 0-3.4 0z"/></svg></div>
        <div class="kpi-body">
          <div class="kpi-label">Overdue</div>
          <div class="kpi-value" id="kpiOverdue">—</div>
        </div>
      </button>

      <button class="kpi-card" data-accent="amber" data-view="returns">
        <div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 2m6-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg></div>
        <div class="kpi-body">
          <div class="kpi-label">Avg Return Time</div>
          <div class="kpi-value kpi-value-sm" id="kpiAvgReturn">—</div>
        </div>
      </button>

      <button class="kpi-card" data-accent="purple" id="kpiTopTechCard">
        <div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></div>
        <div class="kpi-body">
          <div class="kpi-label">Top Tech Today</div>
          <div class="kpi-value kpi-value-sm" id="kpiTopTech">—</div>
        </div>
      </button>
    </section>

    <!-- ============ WORKSPACE: table (left) + filters (right) ============ -->
    <div class="workspace">
      <!-- MAIN -->
      <section class="main">
        <div class="tabs" id="tabs">
          <button class="tab" data-view="out">Currently Out</button>
          <button class="tab" data-view="overdue">Overdue</button>
          <button class="tab" data-view="returns">Recent Returns</button>
          <button class="tab" data-view="all">All Check-Outs</button>
          <button class="tab tab-review" data-view="review">Needs Review</button>
        </div>

        <div class="panel table-panel">
          <div class="panel-head">
            <div class="ph-left">
              <h2 id="mainTitle">Currently Out</h2>
              <span class="count-badge" id="mainCount">0</span>
            </div>
            <div class="ph-right">
              <div class="search-box">
                <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="search" id="tableSearch" placeholder="Search this view…" autocomplete="off" />
              </div>
              <button id="saveSearchBtn" class="btn btn-ghost btn-sm" title="Save the current search">★ Save</button>
              <button id="exportBtn" class="btn btn-ghost btn-sm" title="Download the current view as a CSV">Export CSV</button>
            </div>
          </div>
          <p class="hint">Tip: click a row for details, a technician's name for their summary, or a column header to sort.</p>
          <div id="savedSearches" class="saved-searches"></div>
          <div class="table-wrap" id="mainTableWrap">
            <table id="tblMain"><thead></thead><tbody></tbody></table>
          </div>
        </div>
      </section>

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <section class="panel filter-panel">
          <div class="panel-head">
            <h2><svg viewBox="0 0 24 24" class="ic"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>Filters</h2>
            <button id="clearFilters" class="btn btn-ghost btn-sm">Clear</button>
          </div>
          <div class="filter-field">
            <label for="fromDate">From</label>
            <input type="date" id="fromDate" />
          </div>
          <div class="filter-field">
            <label for="toDate">To</label>
            <input type="date" id="toDate" />
          </div>
          <div class="filter-field">
            <label for="fTech">Technician</label>
            <select id="fTech"><option value="">All technicians</option></select>
          </div>
          <div class="filter-field">
            <label for="fItem">Tool</label>
            <select id="fItem"><option value="">All tools</option></select>
          </div>
          <div class="filter-field">
            <label for="fBranch">Van #</label>
            <select id="fBranch"><option value="">All vans</option></select>
          </div>
        </section>

        <section class="panel toplist-panel">
          <div class="panel-head">
            <h2>Most Active Today</h2>
            <span class="muted-sub">tap a name</span>
          </div>
          <div id="topTechList" class="toplist"></div>
        </section>

        <section class="panel overdue-panel" id="overduePanel" hidden>
          <div class="panel-head">
            <h2>Overdue by Tech</h2>
            <span class="muted-sub">needs follow-up</span>
          </div>
          <div id="overdueByTech" class="toplist"></div>
        </section>
      </aside>
    </div>

    <footer class="foot">
      <span id="rowCount">0 records</span>
      <span id="dataHealth" class="data-health"></span>
      <span>CageTrack · Peterman Brothers</span>
    </footer>
  </div>

  <!-- ============ MODAL ============ -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle">Details</h3>
        <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="mockData.js"></script>
  <script src="app.js"></script>
</body>
</html>
